[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bancaemdia-api"
version = "0.1.0"
description = "Backend API for the Bet Spreadsheet SaaS"
readme = "README.md"
authors = [{name = "Pradyumna", email = "pradyumna@example.com"}]
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.2",
    "redis>=5.0.8",
    "celery>=5.4.0",
    "pybreaker>=0.8.1",
    "tenacity>=8.5.0",
    "slowapi>=0.1.9",
    "structlog>=25.1.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=3.8.0",
    "testcontainers[postgresql,redis]>=4.10.0",
]

[tool.poetry]
packages = [{include = "bancaemdia", from = "src"}]

[tool.ruff]
target-version = "py312"
line-length = 100
preview = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [
    "line-too-long",                    # E501 handled by formatter
    "function-call-in-default-argument", # B008 intentional for settings
]
per-file-ignores = { "tests/*" = ["assert", "hardcoded-password-func-arg"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["bancaemdia"]
known-third-party = [
    "fastapi", "uvicorn", "sqlalchemy", "asyncpg", "alembic",
    "pydantic", "pydantic_settings", "jose", "passlib", "httpx",
    "redis", "celery", "pybreaker", "tenacity", "slowapi",
    "structlog", "prometheus_client", "opentelemetry",
]
sections = { "FUTURE" = [], "STDLIB" = [], "THIRDPARTY" = [], "FIRSTPARTY" = [], "LOCALFOLDER" = [] }

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
implicit_reexport = false
allow_untyped_globals = false
enable_error_code = ["ignore-without-code"]
exclude = ["tests/.*", "alembic/.*", "scripts/.*"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["pydantic.*", "sqlalchemy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bancaemdia.config"]
disallow_any_generics = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-n 8 --dist loadscope --tb=short -q --strict-markers"
markers = [
    "unit: Unit tests (no I/O)",
    "integration: Integration tests (Testcontainers)",
    "contract: Contract tests (Pact)",
    "idempotency: Idempotency tests",
    "edge_cases: Financial/temporal edge cases",
    "chaos: Failure injection tests",
]

[tool.coverage.run]
source = ["src/bancaemdia"]
omit = ["tests/*", "alembic/*", "scripts/*", "src/bancaemdia/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2