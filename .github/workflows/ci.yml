name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  format:
    name: Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: mypy src/ --strict --ignore-missing-imports

  security:
    name: Security scan (dependencies and code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]" pip-audit==2.10.1 bandit==1.9.4
      - run: pip-audit --local --skip-editable
      - run: bandit -r src/bancaemdia -q -lll

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: >
          pytest -n 8 --dist loadgroup --tb=short -q
          --cov=src/bancaemdia --cov-fail-under=80
          --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=test-results.xml
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/bancaemdia
          DATABASE_URL_REPLICA: postgresql+asyncpg://user:pass@localhost:5432/bancaemdia
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          LOG_LEVEL: DEBUG
          JWT_SECRET_KEY: test-secret
          JWT_ALGORITHM: RS256
          JWT_AUDIENCE: bancaemdia-api
          JWT_ISSUER: bancaemdia-api
          RATE_LIMIT_STORAGE: memory://
          STATEMENT_TIMEOUT_PRIMARY: 5000
          STATEMENT_TIMEOUT_REPLICA: 30000
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  contract:
    name: Contract (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Run contract tests
        run: pytest tests/contract/ -v
      - name: Verify generated OpenAPI artifacts
        run: python scripts/generate_openapi.py --check
      - name: Verify canonical collection N/N-1 artifacts
        run: python scripts/generate_collection_contract.py --check
      - name: Prepare origin/main OpenAPI baseline
        id: openapi_baseline
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/.openapi-main.json"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

          if git show origin/main:tests/contract/schemas/openapi.json > "$baseline" 2>/dev/null; then
            echo "Using the checked-in origin/main OpenAPI snapshot."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$baseline"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::origin/main has no checked-in OpenAPI snapshot; this PR establishes the initial baseline."
          fi
      - name: Reject breaking API changes
        if: >-
          github.event_name == 'pull_request' &&
          steps.openapi_baseline.outputs.available == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b
        with:
          base: .openapi-main.json
          revision: tests/contract/schemas/openapi.json
          fail-on: WARN
          allow-external-refs: false
          review: false
          github-token: ""

  accounts-billing-db:
    name: Accounts and billing (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: >-
          pytest -n 0 tests/integration/test_billing_access_db.py
          tests/integration/test_troca_titular.py tests/integration/test_titulares_api.py
          tests/integration/test_account_financials.py tests/integration/test_game_account_attribution.py
          tests/integration/test_materialization_db.py
          --tb=short --junitxml=accounts-billing-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      - run: python scripts/check_review_acceptance.py accounts-billing-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-billing-acceptance
          path: accounts-billing-results.xml

  pairing-db:
    name: Collection contracts (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/coleta/ tests/integration/test_coleta_db.py tests/security/test_coleta_tokens.py -n 0 --show-capture=no --junitxml=pairing-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairing-results
          path: pairing-results.xml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, security, test, contract, accounts-billing-db, pairing-db]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bancaemdia-api .

  catalog:
    name: Catalog acceptance (${{ matrix.base }}, PostgreSQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [main, installation]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      DATABASE_URL_REPLICA: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      REDIS_URL: redis://localhost:6379/0
      COLETA_TOKEN_SECRET: synthetic-catalog-test-hmac
      JWT_SECRET_KEY: synthetic-catalog-test-only
      JWT_AUDIENCE: test
      JWT_ISSUER: test
      APP_ENV: testing
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]" pip-audit==2.10.1 bandit==1.9.4
      - name: Security of product dependencies and production code
        run: pip-audit --local --skip-editable && bandit -r src/bancaemdia -q -lll
      - name: Pin installation prerequisite in disposable composition
        if: matrix.base == 'installation'
        run: python scripts/prepare_catalog_integration.py --destination /tmp/catalog-integration --product-sha ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Real main catalog acceptance
        if: matrix.base == 'main'
        run: pytest tests/catalogo/catalog_database_acceptance.py -n 0 --junitxml=catalog-main.xml
      - name: Real installation lifecycle and catalog acceptance
        if: matrix.base == 'installation'
        working-directory: /tmp/catalog-integration
        run: |
          pip install -e ".[dev]"
          ruff check src/
          ruff format --check src/
          mypy src/ --strict --ignore-missing-imports
          pip-audit --local --skip-editable
          bandit -r src/bancaemdia -q -lll
          pytest tests/catalogo/catalog_database_acceptance.py tests/catalogo/installation_catalog_acceptance.py tests/integration/coleta/test_pairing.py tests/security/test_coleta_tokens.py -n 0 --junitxml=catalog-installation.xml
      - name: Reject skipped, failed, missing acceptance
        run: python scripts/check_catalog_junit.py ${{ matrix.base }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-${{ matrix.base }}
          path: |
            catalog-main.xml
            /tmp/catalog-integration/catalog-installation.xml
            /tmp/catalog-integration/catalog-composition.json
