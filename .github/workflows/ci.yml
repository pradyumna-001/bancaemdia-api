name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  format:
    name: Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install mypy pydantic sqlalchemy types-requests
      - run: mypy src/ --strict --ignore-missing-imports

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: bancaemdia
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bancaemdia -d bancaemdia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest -n 8 --tb=short -q --cov=src/bancaemdia --cov-fail-under=80
        env:
          DATABASE_URL: postgresql+asyncpg://bancaemdia:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/bancaemdia
          DATABASE_URL_REPLICA: postgresql+asyncpg://bancaemdia:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/bancaemdia
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          LOG_LEVEL: DEBUG
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM: RS256
          JWT_AUDIENCE: bancaemdia-api
          JWT_ISSUER: bancaemdia-api
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_TIMEOUT: 30
          ANTHROPIC_MAX_RETRIES: 3
          RATE_LIMIT_STORAGE: memory://
          STATEMENT_TIMEOUT_PRIMARY: 5000
          STATEMENT_TIMEOUT_REPLICA: 30000
          OTEL_EXPORTER_OTLP_ENDPOINT: ""

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bancaemdia-api .
