name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  format:
    name: Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: mypy src/ --strict --ignore-missing-imports

  security:
    name: Security scan (dependencies and code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]" pip-audit==2.10.1 bandit==1.9.4
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: pip-audit --local --skip-editable
      - run: bandit -r src/bancaemdia -q -ll -ii

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: >
          pytest -n 8 --dist loadgroup --tb=short -q
          --cov=src/bancaemdia --cov-fail-under=80
          --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=test-results.xml
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/bancaemdia
          DATABASE_URL_REPLICA: postgresql+asyncpg://user:pass@localhost:5432/bancaemdia
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          LOG_LEVEL: DEBUG
          JWT_SECRET_KEY: test-secret
          JWT_ALGORITHM: RS256
          JWT_AUDIENCE: bancaemdia-api
          JWT_ISSUER: bancaemdia-api
          RATE_LIMIT_STORAGE: memory://
          STATEMENT_TIMEOUT_PRIMARY: 5000
          STATEMENT_TIMEOUT_REPLICA: 30000
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  contract:
    name: Contract (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Run contract tests
        run: pytest tests/contract/ -v
      - name: Verify generated OpenAPI artifacts
        run: python scripts/generate_openapi.py --check
      - name: Verify canonical collection N/N-1 artifacts
        run: python scripts/generate_collection_contract.py --check
      - name: Prepare origin/main OpenAPI baseline
        id: openapi_baseline
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/.openapi-main.json"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

          if git show origin/main:tests/contract/schemas/openapi.json > "$baseline" 2>/dev/null; then
            echo "Using the checked-in origin/main OpenAPI snapshot."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$baseline"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::origin/main has no checked-in OpenAPI snapshot; this PR establishes the initial baseline."
          fi
      - name: Reject breaking API changes
        if: >-
          github.event_name == 'pull_request' &&
          steps.openapi_baseline.outputs.available == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b
        with:
          base: .openapi-main.json
          revision: tests/contract/schemas/openapi.json
          fail-on: WARN
          allow-external-refs: false
          review: false
          github-token: ""

  accounts-billing-db:
    name: Accounts and billing (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: >-
          pytest -n 0 tests/integration/test_billing_access_db.py
          tests/integration/test_troca_titular.py tests/integration/test_titulares_api.py
          tests/integration/test_account_financials.py tests/integration/test_game_account_attribution.py
          tests/integration/test_materialization_db.py
          --tb=short --junitxml=accounts-billing-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      - run: python scripts/check_review_acceptance.py accounts-billing-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-billing-acceptance
          path: accounts-billing-results.xml

  pairing-db:
    name: Collection contracts (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/coleta/ tests/integration/test_coleta_db.py tests/security/test_coleta_tokens.py -n 0 --show-capture=no --junitxml=pairing-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      - run: python scripts/check_review_acceptance.py pairing-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairing-results
          path: pairing-results.xml

  reader-fixtures:
    name: Reader fixtures (safety and review)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/coleta/ -n 0 --junitxml=reader-contract-results.xml
      - name: Verify every fixture and trusted human review
        run: python scripts/validate_reader_fixtures.py --base-ref origin/main --report reader-capabilities.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-contract-evidence
          path: |
            reader-contract-results.xml
            reader-capabilities.json

  reader-postgres:
    name: Reader quarantine (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      APP_ENV: testing
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Generate masked disposable database credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          password = secrets.token_hex(32)
          print(f'::add-mask::{password}')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
            env.write(f'POSTGRES_PASSWORD={password}\n')
            env.write(f'PGPASSWORD={password}\n')
            env.write(f'TEST_DATABASE_URL=postgresql+asyncpg://postgres:{password}@localhost:5432/reader_acceptance\n')
          PY
      - name: Start authenticated PostgreSQL 16 on loopback
        run: |
          docker run --detach --name reader-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD \
            --env POSTGRES_DB=reader_acceptance postgres:16
          for attempt in $(seq 1 30); do
            if docker exec reader-postgres pg_isready -U postgres -d reader_acceptance; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pip install -e ".[dev]"
      - name: Required reader acceptance on its own disposable database
        run: pytest tests/coleta/reader_quarantine_acceptance.py -n 0 --junitxml=reader-postgres-results.xml
      - name: Inherited integration and historical migration regression in isolated database
        run: |
          createdb -h localhost -U postgres legacy_integrations
          export TEST_DATABASE_URL="${TEST_DATABASE_URL%/*}/legacy_integrations"
          pytest tests/integration/ -n 0 --junitxml=legacy-postgres-results.xml
      - name: Reject missing or skipped acceptance
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          reader = ET.parse('reader-postgres-results.xml').getroot()
          legacy = ET.parse('legacy-postgres-results.xml').getroot()
          assert len(list(reader.iter('testcase'))) == 16, 'reader acceptance inventory missing'
          assert not list(reader.iter('skipped')), 'mandatory reader PostgreSQL tests cannot skip'
          assert len(list(legacy.iter('testcase'))) >= 120, 'inherited regression inventory missing'
          historical = {
            'test_painel_totals_match_the_conferir_numeros_logic',
            'test_reads_land_on_the_standby_under_rls_and_writes_on_the_primary',
            'test_a_new_bet_is_seen_for_five_seconds_while_the_standby_is_behind',
            'test_standby_lag_is_zero_when_caught_up_and_grows_while_replay_is_paused',
          }
          skipped = {c.attrib['name'] for c in legacy.iter('testcase') if c.find('skipped') is not None}
          assert skipped <= historical, 'unexpected inherited regression skip'
          for suites in (reader, legacy):
            assert not list(suites.iter('failure')) and not list(suites.iter('error'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-postgres-evidence
          path: |
            reader-postgres-results.xml
            legacy-postgres-results.xml
      - name: Remove disposable database container
        if: always()
        run: docker rm --force reader-postgres

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, security, test, contract, accounts-billing-db, pairing-db, catalog, reader-fixtures, reader-postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bancaemdia-api .

  catalog:
    name: Catalog and installation (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Generate masked disposable database credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          password = secrets.token_hex(32)
          print(f'::add-mask::{password}')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
            env.write(f'POSTGRES_PASSWORD={password}\n')
            env.write(f'PGPASSWORD={password}\n')
            env.write(f'TEST_DATABASE_URL=postgresql+asyncpg://postgres:{password}@localhost:5432/bancaemdia\n')
          PY
      - name: Start authenticated PostgreSQL 16 on loopback
        run: |
          docker run --detach --name catalog-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD \
            --env POSTGRES_DB=bancaemdia postgres:16
          for attempt in $(seq 1 30); do
            if docker exec catalog-postgres pg_isready -U postgres -d bancaemdia; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pip install -e ".[dev]"
      - run: pytest tests/catalogo/catalog_database_acceptance.py tests/catalogo/installation_catalog_acceptance.py -n 0 --tb=short --junitxml=catalog-installation.xml
      - run: python scripts/check_catalog_junit.py installation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-installation
          path: catalog-installation.xml
      - name: Remove disposable catalog database
        if: always()
        run: docker rm --force catalog-postgres
