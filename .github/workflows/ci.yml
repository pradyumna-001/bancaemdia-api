name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  format:
    name: Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: mypy src/ --strict --ignore-missing-imports

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: >
          pytest -n 8 --dist loadgroup --tb=short -q
          --cov=src/bancaemdia --cov-fail-under=80
          --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=test-results.xml
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/bancaemdia
          DATABASE_URL_REPLICA: postgresql+asyncpg://user:pass@localhost:5432/bancaemdia
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          LOG_LEVEL: DEBUG
          JWT_SECRET_KEY: test-secret
          JWT_ALGORITHM: RS256
          JWT_AUDIENCE: bancaemdia-api
          JWT_ISSUER: bancaemdia-api
          RATE_LIMIT_STORAGE: memory://
          STATEMENT_TIMEOUT_PRIMARY: 5000
          STATEMENT_TIMEOUT_REPLICA: 30000
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  contract:
    name: Contract (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Run contract tests
        run: pytest tests/contract/ -v
      - name: Verify generated OpenAPI artifacts
        run: python scripts/generate_openapi.py --check
      - name: Prepare origin/main OpenAPI baseline
        id: openapi_baseline
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/.openapi-main.json"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

          if git show origin/main:tests/contract/schemas/openapi.json > "$baseline" 2>/dev/null; then
            echo "Using the checked-in origin/main OpenAPI snapshot."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$baseline"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::origin/main has no checked-in OpenAPI snapshot; this PR establishes the initial baseline."
          fi
      - name: Reject breaking API changes
        if: >-
          github.event_name == 'pull_request' &&
          steps.openapi_baseline.outputs.available == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b
        with:
          base: .openapi-main.json
          revision: tests/contract/schemas/openapi.json
          fail-on: WARN
          allow-external-refs: false
          review: false
          github-token: ""

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, test, contract, integrity]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bancaemdia-api .

  integrity:
    name: Collection integrity (PostgreSQL + Redis, repeat ${{ matrix.repeat }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch pinned prerequisites
        run: git fetch --no-tags origin db7f63eccd03635bac20235270bffa30351e41a9 0dfd5a6cfe70a94bb813d47dac50b2f64ed3b073 9210cef7e1b64664ac8ad347afa69ad02c056cef 427e6af8d6664bd2076bfe6518be754b5934d77b
      - name: Assemble full integration outside product branch
        run: python scripts/prepare_integrity_integration.py /tmp/integrity
      - run: pip install -e "/tmp/integrity[dev]" pip-audit==2.10.1 bandit==1.9.4
      - name: Validate complete composed production code and security
        run: ruff check src/ && ruff format --check src/ && mypy src/ --strict --ignore-missing-imports && pip-audit --local --skip-editable && bandit -r src/bancaemdia -q -lll
        working-directory: /tmp/integrity
      - name: Repeated complete matrix with real concurrent requests and workers
        run: >
          pytest tests/integration/coleta/ tests/integration/test_troca_titular.py
          tests/convergence/financial_acceptance.py tests/cli/test_reconciliar_casa_telegram.py
          tests/integrity/collection_acceptance.py tests/integrity/accounts_races_acceptance.py
          tests/integrity/security_acceptance.py -n 0 --show-capture=no
          --junitxml=integrity-results.xml
        working-directory: /tmp/integrity
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
          REDIS_URL: redis://localhost:6379/0
          INTEGRITY_SEED: ${{ matrix.repeat }}
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
      - name: Reject missing, skipped, failed or duplicated acceptance cases
        run: python scripts/check_integrity_junit.py /tmp/integrity/integrity-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-repeat-${{ matrix.repeat }}
          path: |
            /tmp/integrity/integrity-results.xml
            /tmp/integrity/integrity-heads.json
            /tmp/integrity/integrity-diagnostics/
