name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phase1-config:
    name: Phase 1 Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Lightsail stack
        run: |
          set -euo pipefail
          cd deploy/lightsail
          cp compose.env.example compose.env
          cp runtime.env.example runtime.env
          cp runtime.env.example maintenance.env
          mkdir -p secrets
          printf 'placeholder-for-config-validation\n' > secrets/postgres_admin_password
          docker compose --env-file compose.env -f compose.yml --profile ops config --quiet

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  format:
    name: Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: mypy src/ --strict --ignore-missing-imports

  security:
    name: Security (dependencies and source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv pip-audit bandit
      - run: uv lock --check
      - run: uv export --no-dev --format requirements-txt --no-hashes --no-emit-project -o runtime-requirements.txt
      - run: pip-audit -r runtime-requirements.txt --no-deps --disable-pip --format json -o security-dependencies.json
      - run: bandit -r src -ll --format json -o security-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security
          path: security-*.json

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Run complete suite and isolated performance acceptance
        run: |
          # Keep the HTTP benchmark's CPU budget independent of xdist workers.
          pytest -n 8 --dist loadgroup --tb=short -q \
            --ignore=tests/integration/test_prelaunch_painel_replay.py \
            --cov=src/bancaemdia --cov-fail-under=80 \
            --cov-report=term --cov-report=xml:coverage.xml --junitxml=test-results.xml
          if [ -f tests/integration/test_prelaunch_painel_replay.py ]; then
            pytest tests/integration/test_prelaunch_painel_replay.py -n 0 --tb=short -q \
              --cov=src/bancaemdia --cov-append --cov-fail-under=80 \
              --cov-report=term --cov-report=xml:coverage.xml --junitxml=benchmark-results.xml
          fi
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/bancaemdia
          DATABASE_URL_REPLICA: postgresql+asyncpg://user:pass@localhost:5432/bancaemdia
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          LOG_LEVEL: DEBUG
          JWT_SECRET_KEY: test-secret
          JWT_ALGORITHM: RS256
          JWT_AUDIENCE: bancaemdia-api
          JWT_ISSUER: bancaemdia-api
          RATE_LIMIT_STORAGE: memory://
          STATEMENT_TIMEOUT_PRIMARY: 5000
          STATEMENT_TIMEOUT_REPLICA: 30000
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            benchmark-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  contract:
    name: Contract (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Run contract tests
        run: pytest tests/contract/ -v
      - name: Verify generated OpenAPI artifacts
        run: python scripts/generate_openapi.py --check
      - name: Verify canonical collection N/N-1 artifacts
        run: python scripts/generate_collection_contract.py --check
      - name: Prepare origin/main OpenAPI baseline
        id: openapi_baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/.openapi-main.json"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          if git cat-file -e "$BASE_SHA:tests/contract/schemas/openapi.json" 2>/dev/null; then
            python scripts/prepare_openapi_baseline.py --ref "$BASE_SHA" --output "$baseline"
            echo "Using the checked-in pull request base OpenAPI snapshot."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            baseline_dir="$(mktemp -d)"
            git archive "$BASE_SHA" | tar -x -C "$baseline_dir"
            # The legacy base imports python-jose. Keep it outside the product environment.
            python -m venv --system-site-packages "$baseline_dir/.venv"
            "$baseline_dir/.venv/bin/pip" install 'python-jose[cryptography]==3.5.0'
            "$baseline_dir/.venv/bin/python" scripts/generate_openapi.py \
              --source-root "$baseline_dir/src" --schema-only --schema-output "$baseline"
            echo "Generated the OpenAPI baseline from the exact pull request base source."
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject breaking API changes
        if: >-
          github.event_name == 'pull_request' &&
          steps.openapi_baseline.outputs.available == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b
        with:
          base: .openapi-main.json
          revision: tests/contract/schemas/openapi.json
          fail-on: WARN
          allow-external-refs: false
          review: false
          github-token: ""

  accounts-billing-db:
    name: Accounts and billing (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: >-
          pytest -n 0 tests/integration/test_billing_access_db.py
          tests/integration/test_troca_titular.py tests/integration/test_titulares_api.py
          tests/integration/test_account_financials.py tests/integration/test_game_account_attribution.py
          tests/integration/test_materialization_db.py
          --tb=short --junitxml=accounts-billing-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      - run: python scripts/check_review_acceptance.py accounts-billing-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-billing-acceptance
          path: accounts-billing-results.xml

  pairing-db:
    name: Collection contracts (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/coleta/ tests/integration/test_coleta_db.py tests/security/test_coleta_tokens.py -n 0 --show-capture=no --junitxml=pairing-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      - run: python scripts/check_review_acceptance.py pairing-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairing-results
          path: pairing-results.xml

  reader-fixtures:
    name: Reader fixtures (safety and review)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/coleta/ -n 0 --junitxml=reader-contract-results.xml
      - name: Verify fixture safety, publication authorization and human review
        run: python scripts/validate_reader_fixtures.py --base-ref origin/main --report reader-capabilities.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-contract-evidence
          path: |
            reader-contract-results.xml
            reader-capabilities.json

  reader-postgres:
    name: Reader quarantine (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      APP_ENV: testing
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Generate masked disposable database credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          password = secrets.token_hex(32)
          print(f'::add-mask::{password}')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
            env.write(f'POSTGRES_PASSWORD={password}\n')
            env.write(f'PGPASSWORD={password}\n')
            env.write(f'TEST_DATABASE_URL=postgresql+asyncpg://postgres:{password}@localhost:5432/reader_acceptance\n')
          PY
      - name: Start authenticated PostgreSQL 16 on loopback
        run: |
          docker run --detach --name reader-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD \
            --env POSTGRES_DB=reader_acceptance postgres:16
          for attempt in $(seq 1 30); do
            if docker exec reader-postgres pg_isready -U postgres -d reader_acceptance; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pip install -e ".[dev]"
      - name: Required reader acceptance on its own disposable database
        run: pytest tests/coleta/reader_quarantine_acceptance.py -n 0 --junitxml=reader-postgres-results.xml
      - name: Inherited integration and historical migration regression in isolated database
        run: |
          createdb -h localhost -U postgres legacy_integrations
          export TEST_DATABASE_URL="${TEST_DATABASE_URL%/*}/legacy_integrations"
          pytest tests/integration/ -n 0 --junitxml=legacy-postgres-results.xml
      - name: Reject missing or skipped acceptance
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          reader = ET.parse('reader-postgres-results.xml').getroot()
          legacy = ET.parse('legacy-postgres-results.xml').getroot()
          assert len(list(reader.iter('testcase'))) == 16, 'reader acceptance inventory missing'
          assert not list(reader.iter('skipped')), 'mandatory reader PostgreSQL tests cannot skip'
          assert len(list(legacy.iter('testcase'))) >= 120, 'inherited regression inventory missing'
          historical = {
            'test_painel_totals_match_the_conferir_numeros_logic',
            'test_reads_land_on_the_standby_under_rls_and_writes_on_the_primary',
            'test_a_new_bet_is_seen_for_five_seconds_while_the_standby_is_behind',
            'test_standby_lag_is_zero_when_caught_up_and_grows_while_replay_is_paused',
          }
          skipped = {c.attrib['name'] for c in legacy.iter('testcase') if c.find('skipped') is not None}
          assert skipped <= historical, 'unexpected inherited regression skip'
          for suites in (reader, legacy):
            assert not list(suites.iter('failure')) and not list(suites.iter('error'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-postgres-evidence
          path: |
            reader-postgres-results.xml
            legacy-postgres-results.xml
      - name: Remove disposable database container
        if: always()
        run: docker rm --force reader-postgres

  identity:
    name: Identity journey (real OIDC, email, browser, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      JWT_ALGORITHM: RS256
      JWT_AUDIENCE: bancaemdia-api
      JWT_ISSUER: bancaemdia-api
      JWT_SECRET_KEY: unused-for-rs256-acceptance
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_STORAGE: memory://
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      STATEMENT_TIMEOUT_PRIMARY: 5000
      STATEMENT_TIMEOUT_REPLICA: 30000
      LOG_LEVEL: DEBUG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Generate disposable credentials
        shell: bash
        run: |
          set -euo pipefail
          db_password=$(openssl rand -hex 24)
          admin_password=$(openssl rand -hex 24)
          echo "::add-mask::$db_password"
          echo "::add-mask::$admin_password"
          echo "POSTGRES_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "KC_BOOTSTRAP_ADMIN_USERNAME=identity-admin-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+asyncpg://identity_test:$db_password@127.0.0.1:55432/bancaemdia_identity" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+asyncpg://identity_test:$db_password@127.0.0.1:55432/bancaemdia_identity" >> "$GITHUB_ENV"
          echo "DATABASE_URL_REPLICA=postgresql+asyncpg://identity_test:$db_password@127.0.0.1:55432/bancaemdia_identity" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL, issuer and SMTP inbox
        run: docker compose -f tests/identity/docker-compose.yml up -d --wait postgres mailpit issuer
      - name: Prove implemented journey and database invariants
        run: pytest -n 0 tests/identity/journey.py tests/integration/test_identity_db.py --junitxml=identity-results.xml --tb=short -v
      - name: Require real acceptance with zero skips
        run: python scripts/check_identity_results.py identity-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-acceptance
          path: identity-results.xml
      - name: Stop only this disposable compose project
        if: always()
        run: docker compose -f tests/identity/docker-compose.yml down

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, security, test, contract, accounts-billing-db, pairing-db, catalog, reader-fixtures, reader-postgres, integrity, reconciliation, telegram-db, identity]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bancaemdia-api .

  catalog:
    name: Catalog and installation (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Generate masked disposable database credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          password = secrets.token_hex(32)
          print(f'::add-mask::{password}')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
            env.write(f'POSTGRES_PASSWORD={password}\n')
            env.write(f'PGPASSWORD={password}\n')
            env.write(f'TEST_DATABASE_URL=postgresql+asyncpg://postgres:{password}@localhost:5432/bancaemdia\n')
          PY
      - name: Start authenticated PostgreSQL 16 on loopback
        run: |
          docker run --detach --name catalog-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD \
            --env POSTGRES_DB=bancaemdia postgres:16
          for attempt in $(seq 1 30); do
            if docker exec catalog-postgres pg_isready -U postgres -d bancaemdia; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pip install -e ".[dev]"
      - run: pytest tests/catalogo/catalog_database_acceptance.py tests/catalogo/installation_catalog_acceptance.py -n 0 --tb=short --junitxml=catalog-installation.xml
      - run: python scripts/check_catalog_junit.py installation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-installation
          path: catalog-installation.xml
      - name: Remove disposable catalog database
        if: always()
        run: docker rm --force catalog-postgres

  integrity:
    name: Collection integrity (PostgreSQL + Redis, repeat ${{ matrix.repeat }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Repeated complete matrix with real concurrent requests and workers
        run: >
          pytest tests/integration/coleta/ tests/integration/test_troca_titular.py
          tests/convergence/financial_acceptance.py tests/cli/test_reconciliar_casa_telegram.py
          tests/integrity/collection_acceptance.py tests/integrity/accounts_races_acceptance.py
          tests/integrity/security_acceptance.py -n 0 --show-capture=no
          --junitxml=integrity-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
          REDIS_URL: redis://localhost:6379/0
          INTEGRITY_SEED: ${{ matrix.repeat }}
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
      - name: Reject missing, skipped, failed or duplicated acceptance cases
        run: python scripts/check_integrity_junit.py integrity-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-repeat-${{ matrix.repeat }}
          path: |
            integrity-results.xml
            integrity-diagnostics/

  reconciliation:
    name: Historical reconciliation (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/cli/reconciliation_acceptance.py -n 0 --show-capture=no --junitxml=reconciliation-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      - run: python scripts/check_review_acceptance.py reconciliation-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-reconciliation
          path: reconciliation-results.xml

  telegram-db:
    name: Telegram hardening (PostgreSQL and Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bancaemdia -d bancaemdia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Validate Telegram alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/rules" prom/prometheus:v3.5.0 check rules /rules/telegram-alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/rules" -w /rules prom/prometheus:v3.5.0 test rules telegram-alerts.test.yml
      - name: Run Telegram integration tests against PostgreSQL
        run: pytest tests/integration/test_telegram_link.py tests/integration/test_telegram_transport.py tests/integration/test_telegram_conversation.py tests/integration/test_telegram_photo_intake.py tests/integration/test_telegram_confirmation.py tests/integration/test_telegram_hardening.py -n 0 -q --junitxml=telegram-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
          TEST_REDIS_URL: redis://localhost:6379/0
      - run: python scripts/check_review_acceptance.py telegram-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-results
          path: |
            telegram-results.xml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Release Docker image
        run: echo "Releasing Docker image bancaemdia-api (would push to registry in real scenario)"
