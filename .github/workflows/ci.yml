name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  format:
    name: Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: mypy src/ --strict --ignore-missing-imports

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: >
          pytest -n 8 --dist loadgroup --tb=short -q
          --cov=src/bancaemdia --cov-fail-under=80
          --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=test-results.xml
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/bancaemdia
          DATABASE_URL_REPLICA: postgresql+asyncpg://user:pass@localhost:5432/bancaemdia
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          LOG_LEVEL: DEBUG
          JWT_SECRET_KEY: test-secret
          JWT_ALGORITHM: RS256
          JWT_AUDIENCE: bancaemdia-api
          JWT_ISSUER: bancaemdia-api
          RATE_LIMIT_STORAGE: memory://
          STATEMENT_TIMEOUT_PRIMARY: 5000
          STATEMENT_TIMEOUT_REPLICA: 30000
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  contract:
    name: Contract (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Run contract tests
        run: pytest tests/contract/ -v
      - name: Verify generated OpenAPI artifacts
        run: python scripts/generate_openapi.py --check
      - name: Prepare pull request base OpenAPI baseline
        id: openapi_baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/.openapi-main.json"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          if git show "$BASE_SHA:tests/contract/schemas/openapi.json" > "$baseline" 2>/dev/null; then
            echo "Using the checked-in pull request base OpenAPI snapshot."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            baseline_dir="$(mktemp -d)"
            git archive "$BASE_SHA" | tar -x -C "$baseline_dir"
            # The legacy base imports python-jose. Keep it outside the product environment.
            python -m venv --system-site-packages "$baseline_dir/.venv"
            "$baseline_dir/.venv/bin/pip" install 'python-jose[cryptography]==3.5.0'
            "$baseline_dir/.venv/bin/python" scripts/generate_openapi.py \
              --source-root "$baseline_dir/src" --schema-only --schema-output "$baseline"
            echo "Generated the OpenAPI baseline from the exact pull request base source."
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject breaking API changes
        if: >-
          github.event_name == 'pull_request' &&
          steps.openapi_baseline.outputs.available == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b
        with:
          base: .openapi-main.json
          revision: tests/contract/schemas/openapi.json
          fail-on: WARN
          allow-external-refs: false
          review: false
          github-token: ""

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, test, contract, matching-db, consolidation-db, convergence-db, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bancaemdia-api .

  matching-db:
    name: Matching acceptance (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_cruzamento_candidatos_db.py tests/integration/test_pareador_db.py -n 0 --show-capture=no --junitxml=matching-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matching-results
          path: matching-results.xml

  security:
    name: Security scan (dependencies and code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" pip-audit==2.10.1 bandit==1.9.4
      - run: pip-audit --local --skip-editable
      - run: bandit -r src/bancaemdia -q -lll

  consolidation-db:
    name: Financial consolidation acceptance (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/cruzamento/ -n 0 --show-capture=no --junitxml=consolidation-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
          REDIS_URL: redis://localhost:6379/0
      - run: python scripts/check_acceptance_junit.py consolidation-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-results
          path: consolidation-results.xml

  convergence-db:
    name: Dependency convergence (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bancaemdia
          POSTGRES_USER: bancaemdia
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bancaemdia -d bancaemdia" --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch pinned dependency HEADs
        run: git fetch origin 9210cef7e1b64664ac8ad347afa69ad02c056cef 427e6af8d6664bd2076bfe6518be754b5934d77b
      - name: Prepare disposable composition
        run: python scripts/prepare_convergence.py /tmp/bancaemdia-convergence
      - run: pip install -e "/tmp/bancaemdia-convergence[dev]"
      - run: ruff check src/ && mypy src/ --strict --ignore-missing-imports
        working-directory: /tmp/bancaemdia-convergence
      - run: pytest tests/integration/coleta/ tests/integration/test_troca_titular.py tests/convergence/financial_acceptance.py -n 0 --show-capture=no --junitxml=convergence-results.xml
        working-directory: /tmp/bancaemdia-convergence
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bancaemdia:test-password@localhost:5432/bancaemdia
          REDIS_URL: redis://localhost:6379/0
      - run: python scripts/check_acceptance_junit.py /tmp/bancaemdia-convergence/convergence-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: convergence-results
          path: |
            /tmp/bancaemdia-convergence/convergence-results.xml
            /tmp/bancaemdia-convergence/convergence-heads.json
