name: Phase 1 operational acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  recovery-and-edge:
    runs-on: ubuntu-latest
    env:
      PHASE1_ACCEPTANCE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Real PostgreSQL dump and isolated restore; actual Caddy privacy, metrics and encoding boundary
        run: pytest tests/integration/test_lightsail_acceptance.py -n 0 --junitxml=phase1-results.xml
      - name: Require every operational acceptance scenario without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('phase1-results.xml').findall('.//testcase')
          assert sorted(c.get('name') for c in cases) == [
              'test_actual_caddy_filters_sensitive_logs_and_hides_metrics',
              'test_actual_caddy_relays_the_api_encoding_and_never_compresses_on_its_own',
              'test_real_dump_roundtrip_through_private_object_transport',
          ], [c.get('name') for c in cases]
          assert all(not any(x.tag in ('skipped', 'failure', 'error') for x in c) for c in cases)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-operational-${{ github.event.pull_request.head.sha }}
          path: phase1-results.xml
