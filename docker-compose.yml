services:
  postgres:
    image: postgres:16
    container_name: bancaemdia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancaemdia -d bancaemdia"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bancaemdia-network

  redis:
    image: redis:7-alpine
    container_name: bancaemdia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bancaemdia-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bancaemdia-api
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bancaemdia-network
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  extraction-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "bancaemdia.workers.celery_app:app", "worker", "-Q", "extraction", "--concurrency=1", "--loglevel=INFO"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bancaemdia-network
    volumes:
      - ./src:/app/src

  materialization-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "bancaemdia.workers.celery_app:app", "worker", "-Q", "materialization", "--concurrency=1", "--loglevel=INFO"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bancaemdia-network
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
  redis_data:

networks:
  bancaemdia-network:
    driver: bridge
