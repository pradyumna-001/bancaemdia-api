repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Use the project's installed dependencies, just as CI does. An isolated
      # mirror with only pydantic/sqlalchemy cannot typecheck the application.
      - id: mypy
        name: mypy (complete application, CI scope)
        entry: mypy src/ --strict --ignore-missing-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: reader-fixture-safety
        name: Reviewed reader fixture safety
        entry: python scripts/validate_reader_fixtures.py --base-ref origin/main
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: pytest -n 8 --tb=short -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
