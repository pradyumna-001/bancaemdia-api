repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (project development environment)
        require_serial: true
        entry: python -m mypy
        language: system
        types: [python]
        args: [--strict, --ignore-missing-imports]
      - id: reader-fixture-safety
        name: Reviewed reader fixture safety
        entry: python scripts/validate_reader_fixtures.py --base-ref origin/main
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: pytest -n 8 --tb=short -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
